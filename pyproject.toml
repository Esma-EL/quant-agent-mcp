[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent-mcp"
version = "0.1.0"
description = "Agentic quant assistant: MCP server exposing validated pricing tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
quant-agent-mcp = "quant_agent_mcp.server:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100